openapi: 3.1.0
info:
  title: Xavier REST API
  description: >
    Comprehensive REST API for Xavier, a decentralized semantic context, memory integration,
    and P2P mesh network engine. Xavier supports multi-node federation, secure memory storage with
    decay policies, local GGUF and Ollama model discovery, code graph indexing, and intelligent agent dispatching.
  version: 0.10.0-12-06-2026
servers:
  - url: http://localhost:8006
    description: Local development / production default instance
paths:

  # --- SYSTEM & HEALTH ---
  /health:
    get:
      summary: Get general system health
      description: Returns runtime health, version, provider status, and storage indicators.
      responses:
        "200":
          description: System is healthy or degraded (with details)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealthResponse"
              example:
                status: "ok"
                mode: "LOCAL"
                version: "0.10.0"
                llm:
                  provider: "ollama"
                  model: "qwen3-coder"
                  endpoint: "http://localhost:11434"
                  reachable: true
                embedding:
                  provider: "openai"
                  model: "text-embedding-3-small"
                  status: "Healthy"
                vector_db:
                  backend: "sqlite-vec"
                  path: "./state/.xavier/memory.db"

  /ready:
    get:
      summary: Readiness alias
      description: Standard health readiness indicator endpoint.
      responses:
        "200":
          description: Ready
          content:
            text/plain:
              schema:
                type: string
              example: "OK"

  /readiness:
    get:
      summary: Readiness check
      description: Returns service readiness check.
      responses:
        "200":
          description: Ready
          content:
            text/plain:
              schema:
                type: string
              example: "OK"

  /build:
    get:
      summary: Get build metadata
      description: Returns the build time, Git commit hash, and profile details.
      responses:
        "200":
          description: Build metadata details
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  commit:
                    type: string
                  build_time:
                    type: string
              example:
                version: "0.10.0"
                commit: "f7a39d2c4b8b"
                build_time: "2026-06-12T10:00:00Z"

  /v1/version:
    get:
      summary: Get v1 version metadata
      description: Returns API and system version metadata.
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
              example:
                version: "0.10.0-12-06-2026"

  /system/alerts:
    get:
      summary: Get current system alerts
      description: Returns actively logged system errors or degradation notices.
      security:
        - XavierToken: []
      responses:
        "200":
          description: Active alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemAlert"
              example:
                - level: "WARN"
                  message: "Local embedding model has changed. Reindexing spawned."
                  category: "embeddings"

  # --- AUTHENTICATION ---
  # --- AUTH (real, working user-auth API: src/auth2/, backed by .xavier/auth.db) ---
  # NOTE: earlier revisions of this spec documented a parallel `/v1/auth/*` API
  # (login/register/refresh/logout/totp) as canonical. That API was backed by a user store
  # nothing ever wrote a user into (security::auth_store::AuthStore::create_user had zero
  # callers) — every login attempt against it failed forever. It was removed and those paths
  # now answer 308/410 pointing here. See GH #2545 and the "Deprecated" section at the bottom
  # of this file.
  /auth/register:
    post:
      summary: User registration
      description: >
        Registers a new user. Validates email format and an at-least-12-character password,
        hashes it with Argon2id, generates a 24-word Spanish BIP39 recovery seed phrase, and
        persists everything into `.xavier/auth.db`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 200
                name:
                  type: string
      responses:
        "200":
          description: Registration successful. `seed_phrase` is shown once — it is never returned again and is required by `POST /auth/recovery`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
                  seed_phrase:
                    type: string
              example:
                user:
                  id: "usr_01J239FJKSL"
                  email: "user@example.com"
                  name: "Ada"
                  role: "user"
                  totp_enabled: false
                  created_at: 1750000000
                  updated_at: 1750000000
                seed_phrase: "palabra1 palabra2 ... palabra24"
        "400":
          description: Invalid email/password/name (`invalid_email`, `weak_password`, `invalid_name`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered (`email_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: User login
      description: >
        Logs in a user with email + password, and — if the account has TOTP enabled —
        `totp_code` in the same request (there is no separate verify step). The whole `/auth/*`
        nest, not just this route, is rate-limited (default 20 req/min per caller, see
        `XAVIER_AUTH_RATE_LIMIT`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                totp_code:
                  type: string
                  description: Required only when the account has TOTP enabled.
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: "#/components/schemas/PublicUser"
                  requires_2fa:
                    type: boolean
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refresh_token: "01J239FJKSL0000000000000"
                requires_2fa: false
        "401":
          description: >
            Invalid email/password, or (when TOTP is enabled) a missing/invalid `totp_code`.
            The server does not currently distinguish these cases in the response body — there
            is no separate `mfa_required`/`mfa_invalid` status, and backup codes are not
            accepted here (use `POST /auth/recovery` to regain access without a TOTP device).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded on the `/auth/*` nest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      summary: Rotate an access/refresh token pair
      description: >
        Rotates the refresh token. Reusing an already-rotated (stolen/replayed) token revokes
        the whole token chain and returns 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New token pair issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        "401":
          description: Invalid or expired refresh token.
        "403":
          description: Token reuse detected (possible theft) — the whole chain was revoked.

  /auth/logout:
    post:
      summary: Revoke a refresh token
      description: Idempotent — always 200, even if the token was already invalid or expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token revoked (or already invalid).

  /auth/2fa/setup:
    post:
      summary: Begin TOTP 2FA enrollment (JWT-protected)
      description: >
        Generates a new TOTP secret, a Unicode-rendered QR code (an `otpauth://` URL rendered
        as text, not an image) and 10 one-time backup codes, and stores the pending secret +
        hashed backup codes. The account is NOT yet TOTP-enabled until `POST /auth/2fa/verify`
        confirms a code. Requires `Authorization: Bearer <access_token>`.
      responses:
        "200":
          description: Enrollment material generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code:
                    type: string
                    description: Unicode QR art of the otpauth:// URL (not a PNG/SVG).
                  secret:
                    type: string
                  backup_codes:
                    type: array
                    items:
                      type: string
        "401":
          description: Missing/invalid JWT.

  /auth/2fa/verify:
    post:
      summary: Confirm TOTP 2FA enrollment (JWT-protected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code.
      responses:
        "200":
          description: TOTP enabled on the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: "2fa_enabled"
        "401":
          description: Missing/invalid JWT, or wrong code.
        "400":
          description: No pending TOTP secret to confirm.

  /auth/recovery:
    post:
      summary: Reset password with the BIP39 recovery seed phrase
      description: >
        Verifies the 24-word seed phrase shown once at registration, resets the password, and
        disables TOTP on the account so the user can log back in without the lost device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, seed_phrase, new_password]
              properties:
                email:
                  type: string
                  format: email
                seed_phrase:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: Password reset, TOTP disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: "recovery_completed"
        "400":
          description: Account has no recovery seed on file.
        "401":
          description: Unknown email or wrong seed phrase.

  /auth/check-users:
    get:
      summary: Whether any user has been created yet
      description: Used by first-run onboarding to decide whether to show a "create the first admin" prompt.
      responses:
        "200":
          description: OK

  /v1/auth/sessions:
    get:
      summary: List active root-token sessions
      description: >
        Unrelated to the user-login flow above — sessions created from the root `XAVIER_TOKEN`.
        Requires an authenticated request (root token or agent lease).
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated.

  /v1/auth/sessions/{id}:
    delete:
      summary: Revoke a root-token session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked.
        "401":
          description: Not authenticated.

  # --- DEPRECATED: legacy /v1/auth/* user-login API (GH #2545) ---
  # These paths never worked (dead AuthStore, zero callers ever wrote a user into it — see the
  # note above the AUTH section). They are kept mounted only to redirect stale clients/docs to
  # the real /auth/* routes above, or to say 410 Gone when there is no 1:1 successor.
  /v1/auth/login:
    post:
      deprecated: true
      summary: "Deprecated — use POST /auth/login"
      description: Always answers 308 with a JSON body naming the new path; never performs a login.
      responses:
        "308":
          description: Permanent redirect to `/auth/login`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprecatedAuthResponse"

  /v1/auth/register:
    post:
      deprecated: true
      summary: "Deprecated — use POST /auth/register"
      responses:
        "308":
          description: Permanent redirect to `/auth/register`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprecatedAuthResponse"

  /v1/auth/refresh:
    post:
      deprecated: true
      summary: "Deprecated — use POST /auth/refresh"
      responses:
        "308":
          description: Permanent redirect to `/auth/refresh`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprecatedAuthResponse"

  /v1/auth/logout:
    post:
      deprecated: true
      summary: "Deprecated — use POST /auth/logout"
      responses:
        "308":
          description: Permanent redirect to `/auth/logout`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprecatedAuthResponse"

  /v1/auth/recover:
    post:
      deprecated: true
      summary: "Deprecated — use POST /auth/recovery"
      responses:
        "308":
          description: Permanent redirect to `/auth/recovery`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprecatedAuthResponse"

  /v1/auth/totp/verify:
    post:
      deprecated: true
      summary: "Deprecated — 410 Gone, no direct successor"
      description: >
        TOTP verification is now inline in `POST /auth/login` (`totp_code` field). There is no
        separate verify-after-login endpoint anymore.
      responses:
        "410":
          description: Gone. Body points to `/auth/login`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprecatedAuthResponse"

  /v1/auth/totp/setup:
    post:
      deprecated: true
      summary: "Deprecated — 410 Gone, was never implemented"
      description: This path always returned 501 Not Implemented and was not reachable from any route. Use `POST /auth/2fa/setup` (JWT-protected) or `xavier users totp-enroll`.
      responses:
        "410":
          description: Gone. Body points to `/auth/2fa/setup`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprecatedAuthResponse"

  # --- V1 MEMORIES ---
  /v1/memories:
    get:
      summary: List all memories
      description: Retrieves a paginated list of memories stored in the current active workspace.
      security:
        - XavierToken: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated memories list
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryRecord"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
              example:
                memories:
                  - id: "01J21XPVSTN..."
                    path: "notes/mesh-decision"
                    content: "Decision: use signed mesh manifests"
                    metadata:
                      project: "xavier"
                    created_at: "2026-06-12T10:00:00Z"
                    updated_at: "2026-06-12T10:05:00Z"
                    score: 0.95
                pagination:
                  total: 1
                  limit: 100
                  offset: 0
    post:
      summary: Add or update a memory
      description: >
        Adds a new semantic memory to the current workspace. Alternatively accepts a
        chat-style list of messages to index conversations.
      security:
        - XavierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AddMemoryPayload"
                - $ref: "#/components/schemas/ChatMemoryPayload"
      responses:
        "200":
          description: Memory successfully indexed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  id:
                    type: string
              example:
                status: "ok"
                message: "Memory added successfully"
                id: "01J21XPVSTN..."

  /v1/memories/{id}:
    get:
      summary: Get a memory by ID
      description: Retrieves the detailed record of a single indexed memory.
      security:
        - XavierToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detailed memory record
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  memory:
                    $ref: "#/components/schemas/MemoryRecord"
              example:
                status: "ok"
                memory:
                  id: "01J21XPVSTN..."
                  path: "notes/mesh-decision"
                  content: "Decision: use signed mesh manifests"
                  metadata:
                    project: "xavier"
                  created_at: "2026-06-12T10:00:00Z"
                  updated_at: "2026-06-12T10:05:00Z"
                  score: 0.95
        "440":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update an existing memory
      description: Modifies an existing memory record by ID.
      security:
        - XavierToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemoryPayload"
      responses:
        "200":
          description: Memory successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: "ok"
                message: "Memory updated successfully"

    delete:
      summary: Delete a memory by ID
      description: Removes a memory record from the database.
      security:
        - XavierToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Memory successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: "ok"
                message: "Memory deleted successfully"

  /v1/memories/search:
    post:
      summary: Search memories
      description: Performs a hybrid search over indexed memory records using text and vector embeddings.
      security:
        - XavierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySearchRequest"
      responses:
        "200":
          description: Found matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryRecord"
              example:
                status: "ok"
                results:
                  - id: "01J21XPVSTN..."
                    path: "notes/mesh-decision"
                    content: "Decision: use signed mesh manifests"
                    metadata:
                      project: "xavier"
                    score: 0.89

  # --- HEADLESS & AI PROXY ---
  /v1/chat/completions:
    post:
      summary: Headless chat completions with local fallback
      description: >
        Executes an OpenAI-compatible chat completion. If the secure LLM proxy fails or is unreachable,
        automatically falls back to search local memories (returning a synthetic fallback completion with prefix
        `[Modo memoria - LLM no disponible]`).
      security:
        - XavierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
                - model
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant, system]
                      content:
                        type: string
                model:
                  type: string
                stream:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Completion response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                            content:
                              type: string
                        finish_reason:
                          type: string
              example:
                id: "chatcmpl-98127398127"
                object: "chat.completion"
                created: 1718192301
                model: "qwen3-coder"
                choices:
                  - message:
                      role: "assistant"
                      content: "Para configurar el nodo mesh, debes firmar el manifest con tu identidad Ed25519."
                    finish_reason: "stop"

  /v1/embeddings:
    post:
      summary: Generate vector embeddings
      description: Generates an embedding vector for a given input text using the configured embedder.
      security:
        - XavierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  type: string
                model:
                  type: string
      responses:
        "200":
          description: Generated embedding vectors
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                        embedding:
                          type: array
                          items:
                            type: number
                        index:
                          type: integer
              example:
                object: "list"
                data:
                  - object: "embedding"
                    embedding: [0.0123, -0.0456, 0.789, 0.124]
                    index: 0

  # --- MESH & P2P ---
  /v1/mesh/identity:
    get:
      summary: Local node identity
      description: Returns public metadata, including public Ed25519 keys, used to identify this node in the peer-to-peer mesh.
      security:
        - XavierToken: []
      responses:
        "200":
          description: Public node identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id:
                    type: string
                  public_key_hex:
                    type: string
              example:
                node_id: "node_abc123"
                public_key_hex: "d83f2a89cde99a836cb127..."

  /v1/mesh/handshake:
    post:
      summary: Mesh peer handshake
      description: Validates incoming peer handshake requests, verifying cryptographically signed signatures and pairing credentials.
      security:
        - XavierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeshHandshakePayload"
      responses:
        "200":
          description: Handshake approved and completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: "ok"
                message: "Handshake verified and peer registry updated."
        "401":
          description: Invalid handshake signature or token credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- CODE GRAPH ---
  /code/scan:
    post:
      summary: Scan and index codebase
      description: Initiates a deep static analysis of files in a codebase directory and builds its structural relationship index.
      security:
        - XavierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: Absolute path of the codebase directory
      responses:
        "200":
          description: Code scan execution started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  files_found:
                    type: integer
                  message:
                    type: string
              example:
                status: "ok"
                files_found: 142
                message: "Scanning complete. Symbols index updated."

  /code/find:
    post:
      summary: Find code symbols
      description: Search inside the compiled code graph for classes, structs, functions, or variables.
      security:
        - XavierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  default: 10
                kind:
                  type: string
                  enum: [struct, class, function, trait, impl, enum, module]
      responses:
        "200":
          description: Code graph query matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbols:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        kind:
                          type: string
                        filepath:
                          type: string
                        line:
                          type: integer
              example:
                symbols:
                  - name: "MemoryManager"
                    kind: "struct"
                    filepath: "src/memory/store.rs"
                    line: 25

components:
  securitySchemes:
    XavierToken:
      type: apiKey
      in: header
      name: X-Xavier-Token
      description: Preshared secret key configured at startup for server protection.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token returned upon successful user authentication.

  schemas:
    SystemHealthResponse:
      type: object
      properties:
        status:
          type: string
        mode:
          type: string
          enum: [LOCAL, "LOCAL (DEGRADED)", CLOUD, DISABLED]
        version:
          type: string
        llm:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            endpoint:
              type: string
            reachable:
              type: boolean
        embedding:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            status:
              type: string
        vector_db:
          type: object
          properties:
            backend:
              type: string
            path:
              type: string

    SystemAlert:
      type: object
      properties:
        level:
          type: string
          enum: [INFO, WARN, ERROR]
        message:
          type: string
        category:
          type: string

    PublicUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        totp_enabled:
          type: boolean
        created_at:
          type: integer
          description: Unix timestamp (seconds).
        updated_at:
          type: integer
          description: Unix timestamp (seconds).

    DeprecatedAuthResponse:
      type: object
      description: Shared JSON body for every deprecated `/v1/auth/*` route — see GH #2545.
      properties:
        error:
          type: string
          example: "endpoint_deprecated"
        message:
          type: string
        new_path:
          type: string
          description: The `/auth/*` (or `/v1/auth/sessions`) path to use instead.
        docs:
          type: string
          format: uri

    MemoryRecord:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        content:
          type: string
        metadata:
          type: object
        created_at:
          type: string
        updated_at:
          type: string
        score:
          type: number

    AddMemoryPayload:
      type: object
      required:
        - text
        - user_id
      properties:
        text:
          type: string
          description: Plaintext content of the memory
        user_id:
          type: string
          default: default
        metadata:
          type: object
          description: Key-value attributes
        kind:
          type: string
          description: Priority or structural category of the memory
        namespace:
          type: object
          properties:
            project:
              type: string
            session_id:
              type: string

    ChatMemoryPayload:
      type: object
      required:
        - messages
        - user_id
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              content:
                type: string
        user_id:
          type: string

    MemorySearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        limit:
          type: integer
          default: 10
        filters:
          type: object
          properties:
            kinds:
              type: array
              items:
                type: string
            project:
              type: string
            user_id:
              type: string
        active_zones:
          type: array
          items:
            type: string
            enum: [working, semantic, episodic, long_term]

    MeshHandshakePayload:
      type: object
      required:
        - node_id
        - public_key_hex
        - nonce
        - signature_hex
      properties:
        node_id:
          type: string
        public_key_hex:
          type: string
        nonce:
          type: string
        signature_hex:
          type: string
        pairing_secret:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            details:
              type: string
