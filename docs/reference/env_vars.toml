category = "Server & Network"
secret = true

[[variables]]
name = "XAVIER_AUTH_RATE_LIMIT"
type = "u32"
default = "20"
description = "Max requests per minute, per caller, accepted by the whole `/auth/*` nest (register/login/refresh/logout/2FA/recovery/OAuth), sliding 60s window. See `src/cli/http_setup.rs::auth_rate_limit_middleware`."
category = "Server & Network"
secret = false

