default = "10"
description = "Server shutdown grace period in seconds"
category = "Server & Network"
secret = false

[[variables]]
name = "XAVIER_STATE_DIR"
type = "string"
default = "$HOME` (then `$USERPROFILE`, then `.`)"
description = "Base directory for persistent server state: `.xavier/auth.db`, Maloca store, node registry, etc. Set it explicitly (e.g. `/data` in Docker) so state survives container restarts."
category = "Server & Network"
secret = false

[[variables]]
name = "XAVIER_TLS_CERT` / `XAVIER_TLS_KEY"
type = "string` (PEM paths)"
default = "(none)"
description = "When BOTH are set, the HTTP server terminates TLS 1.3 itself (`axum_server::bind_rustls`) instead of plain HTTP. Either var alone is ignored (both required)."
category = "Server & Network"
secret = true

