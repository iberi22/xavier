secret = false

[[variables]]
name = "XAVIER_HOST"
type = "string"
default = "\"127.0.0.1\""
description = "IP address to bind the HTTP server"
category = "Server & Network"
secret = false

[[variables]]
name = "XAVIER_JWT_SECRET"
type = "string"
default = "(none)"
