[package]
authors = ["louisfd <louisfd94@gmail.com>"]
categories = ["science"]
description = "Candle backend for the Burn framework"
edition = "2021"
keywords = ["deep-learning", "machine-learning", "data"]
license = "MIT OR Apache-2.0"
name = "burn-candle"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-candle"
documentation = "https://docs.rs/burn-candle"
version = "0.20.1"

# [lints]
# workspace = true

[features]
default = ["std"]
std = []
doc = ["default"]
tracing = [
    "burn-backend/tracing",
    "burn-std/tracing",
]

cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]
accelerate = ["candle-core/accelerate"]

[dependencies]
burn-backend = "0.20.1"
burn-std = "0.20.1"
candle-core = "=0.9.1"
derive-new = "0.7"

[dev-dependencies]
burn-tch = "0.20.1"

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
