name: Fast Gate (Shadow)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'sprint/**']

jobs:
  shadow-gate:
    name: Shadow Fast Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change (report-only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::notice::classify=$(python3 scripts/classify-change.py --base "$BASE_SHA" --head "$HEAD_SHA" || true)"
          echo "::notice::rust-impact=$(python3 scripts/rust-impact.py --base "$BASE_SHA" --head "$HEAD_SHA" || true)"

      - name: Summary Check
        if: always()
        run: echo "Always-present summary check completed"
