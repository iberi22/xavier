name: Ledger Promoter

on:
  workflow_run:
    workflows: ["Xavier CI / CD", "E2E Segmented"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not open a PR)'
        type: boolean
        required: true
        default: true
      apply_demotions:
        description: 'Also apply stable->beta demotions flagged by the review lane'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate:
    if: vars.LEDGER_PROMOTER_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch recent runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ledger-fetch-evidence.py
      - name: Evaluate promotion
        run: scripts/ledger-promote.py --features docs/reference/features.json --evidence data/evidence.json --history data/history.json

  propose:
    needs: evaluate
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch recent runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ledger-fetch-evidence.py
      - name: Apply promotion
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.apply_demotions == true }}" = "true" ]; then
            scripts/ledger-promote.py --features docs/reference/features.json --evidence data/evidence.json --history data/history.json --apply --apply-demotions
          else
            scripts/ledger-promote.py --features docs/reference/features.json --evidence data/evidence.json --history data/history.json --apply
          fi
      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(ledger): apply automated feature promotions'
          branch: 'bot/ledger-promote'
          title: 'chore(ledger): apply automated feature promotions'
          body: 'Automated changes by the Ledger Promoter workflow.'
