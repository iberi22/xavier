name: Ledger Promoter

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only (owner must separately enable the repository variable)
        type: boolean
        default: true
      apply_demotions:
        description: 'Also apply stable->beta demotions flagged by the review lane'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Xavier CI / CD", "E2E Segmented"]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'

permissions: {}

concurrency:
  group: ledger-promoter
  cancel-in-progress: false

jobs:
  evaluate:
    if: vars.LEDGER_PROMOTER_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.evidence.outputs.sha }}
      main_head: ${{ steps.snapshot.outputs.main_head }}
      mode: ${{ steps.resolve.outputs.mode }}
      eligible_count: ${{ steps.counts.outputs.eligible_count }}
      demotion_count: ${{ steps.counts.outputs.demotion_count }}
    steps:
      - name: Resolve run mode
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # Event fields go through env, never interpolated into the script body
          # (a branch name like `$(...)` must not execute).
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PROMOTER_AUTO: ${{ vars.LEDGER_PROMOTER_AUTO }}
        shell: bash
        run: |
          set -euo pipefail
          auto_mode() {
            if [ "$PROMOTER_AUTO" = "true" ]; then echo "mode=apply"; else echo "mode=dry"; fi
          }
          skip() {
            echo "mode=dry" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ "$DRY_RUN" = "false" ]; then
                echo "mode=apply" >> "$GITHUB_OUTPUT"
              else
                echo "mode=dry" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_run)
              [ "$WR_BRANCH" = "main" ] || skip
              [ "$WR_REPO" = "$GITHUB_REPOSITORY" ] || skip
              [ "$WR_EVENT" = "push" ] || [ "$WR_EVENT" = "workflow_dispatch" ] || skip
              [ "$WR_CONCLUSION" = "success" ] || skip
              auto_mode >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              auto_mode >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "mode=dry" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v7
        if: steps.resolve.outputs.skip != 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Record main snapshot for the promotion PR
        if: steps.resolve.outputs.skip != 'true'
        id: snapshot
        run: echo "main_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Gather newest completed main evidence and reconstruct history
        id: evidence
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ledger-promote-evidence.py
          echo "sha=$(jq -r '.sha // empty' /tmp/ledger-evidence.json)" >> "$GITHUB_OUTPUT"
      - name: Evaluate ledger features (beta->stable, planned/in_progress->beta)
        if: steps.resolve.outputs.skip != 'true'
        shell: bash
        run: |
          python3 scripts/ledger-promote.py --features .gitcore/features.json \
            --evidence /tmp/ledger-evidence.json --history /tmp/ledger-history.json \
            --dry-run > /tmp/ledger-report.json 2> /tmp/ledger-report.md
          cat /tmp/ledger-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Calculate counts
        if: steps.resolve.outputs.skip != 'true'
        id: counts
        run: |
          echo "eligible_count=$(jq '[.features[] | select(.eligible == true)] | length' /tmp/ledger-report.json)" >> "$GITHUB_OUTPUT"
          echo "demotion_count=$(jq '[.features[] | select(.review_flagged == true)] | length' /tmp/ledger-report.json)" >> "$GITHUB_OUTPUT"
      - name: Preserve evidence and report
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ledger-promoter-evidence
          path: |
            /tmp/ledger-*.json
            /tmp/ledger-report.md

  propose:
    needs: evaluate
    if: needs.evaluate.outputs.mode == 'apply' && (needs.evaluate.outputs.eligible_count != '0' || (github.event_name == 'workflow_dispatch' && inputs.apply_demotions == true && needs.evaluate.outputs.demotion_count != '0'))
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Demotions are manual-only: true only for an explicit workflow_dispatch with apply_demotions.
      MANUAL_DEMOTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_demotions == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.evaluate.outputs.main_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ledger-promoter-evidence
          path: /tmp
      - name: Apply evaluated promotions
        run: |
          if [ "$MANUAL_DEMOTIONS" = "true" ]; then
            python3 scripts/ledger-promote.py --features .gitcore/features.json \
              --evidence /tmp/ledger-evidence.json --history /tmp/ledger-history.json \
              --apply --apply-demotions > /tmp/ledger-report.json 2> /tmp/ledger-report.md
          else
            python3 scripts/ledger-promote.py --features .gitcore/features.json \
              --evidence /tmp/ledger-evidence.json --history /tmp/ledger-history.json \
              --apply > /tmp/ledger-report.json 2> /tmp/ledger-report.md
          fi
          if [ -f "scripts/ledger-docs-sync.py" ]; then
            python3 scripts/ledger-docs-sync.py --write
            git add docs/FEATURE_STATUS.md
          fi
      - name: Open promotion PR and dispatch required checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .gitcore/features.json docs/FEATURE_STATUS.md && exit 0

          # Guard: ensure diff is subset
          UNEXPECTED_DIFF=$(git diff HEAD --name-only | grep -v -E '^(\.gitcore/features\.json|docs/FEATURE_STATUS\.md)$' || true)
          if [ -n "$UNEXPECTED_DIFF" ]; then
            echo "Unexpected files modified: $UNEXPECTED_DIFF"
            exit 1
          fi

          sha=$(git rev-parse HEAD)
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$sha"
          if [ "$MANUAL_DEMOTIONS" = "true" ]; then
            branch="ledger/promote-$sha-demote"
          else
            branch="ledger/promote-$sha"
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .gitcore/features.json
            [ -f "docs/FEATURE_STATUS.md" ] && git add docs/FEATURE_STATUS.md
            git commit -m "chore: promote verified ledger features"
            gh auth setup-git
            git push origin "$branch"
          fi
          if [ "$(gh pr list --head "$branch" --base main --state all --json number --jq length)" != 0 ]; then exit 0; fi

          # Prepare PR Body
          cp /tmp/ledger-report.md pr_body.md
          echo "" >> pr_body.md
          PROMOTED_FEATURES=$(jq -r '.promotions["beta->stable"][]?' /tmp/ledger-report.json || true)
          for f in $PROMOTED_FEATURES; do
            ISSUES=$(gh issue list --label ledger-gap --state open --limit 1000 --json number,body | jq -r --arg f "$f" '.[] | select(.body | contains("<!-- ledger-gap:" + $f + " -->")) | .number')
            for i in $ISSUES; do
              echo "Closes #$i" >> pr_body.md
            done
          done

          PR_URL=$(gh pr create --base main --head "$branch" --title "Promote verified ledger features" --body-file pr_body.md)

          gh workflow run ci.yml --ref "$branch"
          gh workflow run fast-gate.yml --ref "$branch"

          gh pr merge "$branch" --auto --squash --match-head-commit "$(git rev-parse HEAD)" || echo "::warning::Auto-merge could not be enabled for PR $PR_URL" >> "$GITHUB_STEP_SUMMARY"
