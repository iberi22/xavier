name: "Release Tauri App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: build xavier backend
        run: cargo build --release --bin xavier ${{ matrix.args }}

      - name: prepare sidecar
        shell: bash
        run: |
          mkdir -p panel-ui/src-tauri/binaries
          if [[ "${{ matrix.args }}" == *"--target"* ]]; then
            TARGET_TRIPLE=$(echo "${{ matrix.args }}" | grep -oE "[a-zA-Z0-9_-]+-apple-darwin")
          else
            TARGET_TRIPLE=$(rustc -Vv | grep host: | cut -d ' ' -f 2)
          fi

          # Find the built binary (could be in target/release or target/<target>/release)
          BINARY_PATH="target/release/xavier"
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            BINARY_PATH="target/release/xavier.exe"
          elif [[ "${{ matrix.args }}" == *"--target"* ]]; then
            BINARY_PATH="target/$TARGET_TRIPLE/release/xavier"
          fi

          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp "$BINARY_PATH" "panel-ui/src-tauri/binaries/xavier-$TARGET_TRIPLE.exe"
          else
            cp "$BINARY_PATH" "panel-ui/src-tauri/binaries/xavier-$TARGET_TRIPLE"
          fi

      - name: install frontend dependencies
        run: pnpm install
        working-directory: panel-ui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "xavier v__VERSION__"
          releaseBody: "See the assets below to download the latest version of xavier."
          releaseDraft: true
          prerelease: false
          projectPath: panel-ui
          args: ${{ matrix.args }}
