name: Rust Coverage (tarpaulin)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  TARPAULIN_ENGINE: llvm

jobs:
  rust-coverage:
    name: cargo-tarpaulin baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Report-only (repo philosophy, cf. pr-gate.yml): the suite itself is proven
    # green by Parallel Rust Tests. Tarpaulin artifact parsing currently fails on
    # llvm-profparser skew (nightly llvm-tools vs tarpaulin 0.32 parser:
    # "consistency check for reading counts failed") — toolchain alignment TBD.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin (pinned)
        run: cargo install cargo-tarpaulin --version "^0.32" --locked

      - name: Run coverage on workspace
        run: bash scripts/coverage.sh all

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: coverage/
          retention-days: 30
