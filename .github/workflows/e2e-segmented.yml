name: E2E Segmented

# Runs the 127 integration-test targets that no other workflow executes, in
# 13 independent jobs.
#
# Why (Belal, 2026-06-06): as a single job the first failing target hides every
# target after it, and nobody learns whether the rest is green. One job per
# segment, and inside each job the loop does not break on failure, so one run
# reports the state of all 127 targets instead of just the first break.
#
# No job goes red on a failing target, on purpose: visibility first. A separate
# gate job decides what blocks a release, so one broken segment never hides the
# other twelve.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e-01:
    name: W01 resto_a (22)
    outputs:
      failed: ${{ steps.run-wave.outputs.failed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run all 22 targets of wave 01
        id: run-wave
        # No `-e` and no `break`: a red target must not hide the rest of its
        # wave. Clear the runner-inherited `-e -o pipefail` (GitHub runs
        # `bash -e -o pipefail`); `${PIPESTATUS[0]}` already isolates cargo's
        # exit code, so the loop must run every target and reach its summary.
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          cargo test --package xavier --features ci-safe --no-run --quiet 2>&1 | tail -20 || true
          targets=(
            'agent_lease_hooks_tests'
            'ci_version_gate'
            'clearance_live_e2e'
            'd1_clavis_vault_leak_red'
            'd2_clavis_wiring_red'
            'docs_adr'
            'encrypt_private_e2e'
            'error_test'
            'hormer_e2e'
            'issue_executor_bridge_test'
            'kernel_proxy_test'
            'mini_expert_integration_test'
            'notification_emitters'
            'proxy_lending_integration'
            'rate_limit_integration'
            'server_e2e'
            'stress_tests'
            'telecom_file_transfer_e2e_test'
            'test_gpud_sidecar'
            'test_store_path_hierarchy'
            'v1_memories_add_path_traversal'
            'workspace_federation_test'
          )
          failed=()
          for t in "${targets[@]}"; do
            echo "=== $t ==="
            timeout -k 15 240 cargo test --package xavier --features ci-safe --test "$t" -- --test-threads=1 2>&1 | tail -20
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then echo "PASS: $t"; else echo "FAIL: $t"; failed+=("$t"); fi
          done
          echo
          echo "==== wave 01 (resto_a): ${#failed[@]}/${#targets[@]} failed ===="
          echo "failed: ${failed[*]:-none}"
          echo "failed=${failed[*]:-none}" >> "$GITHUB_OUTPUT"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-w01-log
          path: "*.log"
          retention-days: 14
          if-no-files-found: ignore

