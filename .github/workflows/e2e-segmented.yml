        # wave. Clear the runner-inherited `-e -o pipefail` (GitHub runs
        # `bash -e -o pipefail`); `${PIPESTATUS[0]}` already isolates cargo's
        # exit code, so the loop must run every target and reach its summary.
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          cargo test --package xavier --features ci-safe --no-run --quiet 2>&1 | tail -20 || true
          targets=(
            'codegraph_installer_e2e'
            'codegraph_scan_then_query'
            'codegraph_uds_ipc_e2e'
          )
          failed=()
          for t in "${targets[@]}"; do
            echo "=== $t ==="
            timeout -k 15 240 cargo test --package xavier --features ci-safe --test "$t" -- --test-threads=1 2>&1 | tail -20
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then echo "PASS: $t"; else echo "FAIL: $t"; failed+=("$t"); fi
          done
          echo
          echo "==== wave 12 (codegraph): ${#failed[@]}/${#targets[@]} failed ===="
          echo "failed: ${failed[*]:-none}"
          echo "failed=${failed[*]:-none}" >> "$GITHUB_OUTPUT"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-w12-log
          path: "*.log"
          retention-days: 14
          if-no-files-found: ignore

  e2e-13:
    name: W13 storage (2)
    outputs:
      failed: ${{ steps.run-wave.outputs.failed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run all 2 targets of wave 13
        id: run-wave
        # No `-e` and no `break`: a red target must not hide the rest of its
        # wave. Clear the runner-inherited `-e -o pipefail` (GitHub runs
        # `bash -e -o pipefail`); `${PIPESTATUS[0]}` already isolates cargo's
        # exit code, so the loop must run every target and reach its summary.
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          cargo test --package xavier --features ci-safe --no-run --quiet 2>&1 | tail -20 || true
          targets=(
            'storage_isolation'
            'unified_storage_validation'
          )
          failed=()
          for t in "${targets[@]}"; do
            echo "=== $t ==="
            timeout -k 15 240 cargo test --package xavier --features ci-safe --test "$t" -- --test-threads=1 2>&1 | tail -20
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then echo "PASS: $t"; else echo "FAIL: $t"; failed+=("$t"); fi
          done
          echo
          echo "==== wave 13 (storage): ${#failed[@]}/${#targets[@]} failed ===="
          echo "failed: ${failed[*]:-none}"
          echo "failed=${failed[*]:-none}" >> "$GITHUB_OUTPUT"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-w13-log
          path: "*.log"
          retention-days: 14
          if-no-files-found: ignore

  # The single blocking job promised by the header comment. The 13 wave jobs stay
  # green-for-visibility (a red target must not hide the other waves); this gate
  # aggregates their results and goes RED iff any wave reported a failing target.
  gate:
    name: E2E gate
    needs: [e2e-01, e2e-02, e2e-03, e2e-04, e2e-05, e2e-06, e2e-07, e2e-08, e2e-09, e2e-10, e2e-11, e2e-12, e2e-13]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether any wave had failing targets
        run: |
          set -u
          gate_failed=0
          check() {
            local job="$1" result="$2"
            if [ "$result" != "none" ]; then
              echo "::error::$job reported failing targets: $result"
              gate_failed=1
            else
              echo "$job: all targets passed"
            fi
          }
          check e2e-01 '${{ needs.e2e-01.outputs.failed }}'
          check e2e-02 '${{ needs.e2e-02.outputs.failed }}'
          check e2e-03 '${{ needs.e2e-03.outputs.failed }}'
          check e2e-04 '${{ needs.e2e-04.outputs.failed }}'
          check e2e-05 '${{ needs.e2e-05.outputs.failed }}'
          check e2e-06 '${{ needs.e2e-06.outputs.failed }}'
          check e2e-07 '${{ needs.e2e-07.outputs.failed }}'
          check e2e-08 '${{ needs.e2e-08.outputs.failed }}'
          check e2e-09 '${{ needs.e2e-09.outputs.failed }}'
          check e2e-10 '${{ needs.e2e-10.outputs.failed }}'
          check e2e-11 '${{ needs.e2e-11.outputs.failed }}'
          check e2e-12 '${{ needs.e2e-12.outputs.failed }}'
          check e2e-13 '${{ needs.e2e-13.outputs.failed }}'
          if [ "$gate_failed" -ne 0 ]; then
            echo "E2E gate FAILED: at least one wave reported failing targets"
            exit 1
          fi
          echo "E2E gate PASSED: all 13 waves reported no failing targets"
