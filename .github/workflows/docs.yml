name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/devlog/**'
      - 'src/chronicle/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/devlog/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Step 1: Setup Node for Astro
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Step 2: Build Xavier binary for Chronicle SSG + auto-docs
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build Xavier
        run: cargo build --release --bin xavier

      # Step 3: Generate DevLog static site
      - name: Chronicle — generate DevLog HTML
        run: |
          if [ -f ./target/release/xavier ]; then
            ./target/release/xavier chronicle build
          else
            cargo build --bin xavier 2>/dev/null && ./target/debug/xavier chronicle build || \
            echo "WARNING: Could not build Xavier. DevLog will not be regenerated."
          fi

      # Step 4: Generate auto-documentation (graceful if no code-graph DB)
      - name: Chronicle — generate auto-docs
        run: |
          if [ -f ./target/release/xavier ]; then
            ./target/release/xavier chronicle auto-docs --output docs/auto-docs 2>/dev/null || \
            echo "INFO: Auto-docs skipped (run 'xavier code-graph index --path .' locally first)"
          fi

      # Step 5: Build Astro documentation site
      - name: Build Astro site
        run: npm run build --workspace docs/site

      # Step 6: Inject DevLog HTML into Astro output
      - name: Inject DevLog into Astro output
        run: |
          if [ -d public/devlog ]; then
            mkdir -p docs/site/dist/devlog
            cp -r public/devlog/* docs/site/dist/devlog/
            echo "DevLog injected at docs/site/dist/devlog/"
          fi

      # Step 7: Prevent Jekyll from eating _astro/ assets
      - name: Create .nojekyll
        run: touch docs/site/dist/.nojekyll

      # Step 8: Upload unified artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
