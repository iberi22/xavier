name: "Release & Test Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-apple-darwin

      - name: Run Backend Tests (Rust)
        run: cargo test --workspace --no-default-features --features ci-safe --exclude xavier-web --exclude app --verbose

      - name: Prepare Tauri Sidecar
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cargo build --release --bin xavier
          mkdir -p panel-ui/src-tauri/binaries
          TARGET_TRIPLE=$(rustc -Vv | awk '/host:/ { print $2 }')

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/xavier.exe "panel-ui/src-tauri/binaries/xavier-$TARGET_TRIPLE.exe"
          else
            cp target/release/xavier "panel-ui/src-tauri/binaries/xavier-$TARGET_TRIPLE"
          fi

      - name: Install Frontend Dependencies
        working-directory: panel-ui
        run: pnpm install

      - name: Build Tauri Executables
        working-directory: panel-ui
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm run build
            cargo check --manifest-path src-tauri/Cargo.toml
          else
            pnpm tauri build
          fi
        
      - name: Upload Build Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xavier-desktop-${{ matrix.os }}
          path: |
            panel-ui/src-tauri/target/release/bundle/msi/*.msi
            panel-ui/src-tauri/target/release/bundle/dmg/*.dmg
