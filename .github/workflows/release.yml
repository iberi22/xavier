name: Release & Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: xavier
            archive_format: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: xavier
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: xavier.exe
            archive_format: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libsqlite3-dev

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --features ci-safe
        shell: bash

      - name: Package Binary Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          ARCHIVE_NAME="xavier-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/${ARCHIVE_NAME}" -C "$(dirname "$BIN_PATH")" "${{ matrix.binary_name }}"
          cd dist && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
        shell: bash

      - name: Package Binary Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $BinPath = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          $ArchiveName = "xavier-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path $BinPath -DestinationPath "dist/$ArchiveName"
          $Hash = (Get-FileHash "dist/$ArchiveName" -Algorithm SHA256).Hash.ToLower()
          "$Hash *$ArchiveName" | Out-File -FilePath "dist/$ArchiveName.sha256" -Encoding ASCII
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
