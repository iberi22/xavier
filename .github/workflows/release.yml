name: "Release & Test Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-apple-darwin

      - name: Install Rust dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install webkit2gtk

      - name: Run Backend Tests (Rust)
        run: cargo test --verbose

      - name: Install Frontend Dependencies
        working-directory: panel-ui
        run: pnpm install

      - name: Build Tauri Executables
        working-directory: panel-ui
        run: pnpm tauri build
        
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xavier-desktop-${{ matrix.os }}
          path: |
            panel-ui/src-tauri/target/release/bundle/msi/*.msi
            panel-ui/src-tauri/target/release/bundle/dmg/*.dmg
