name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: xavier-linux
            archive_name: xavier-linux.tar.gz
            binary_name: xavier
          - os: windows-latest
            asset_name: xavier-windows
            archive_name: xavier-windows.zip
            binary_name: xavier.exe
          - os: macos-latest
            asset_name: xavier-macos
            archive_name: xavier-macos.tar.gz
            binary_name: xavier

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build xavier binary
        run: cargo build --release --bin xavier

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/${{ matrix.archive_name }}" "dist/${{ matrix.binary_name }}"
          else
            tar -C dist -czf "dist/${{ matrix.archive_name }}" "${{ matrix.binary_name }}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive_name }}

