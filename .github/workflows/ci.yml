name: Xavier CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'sprint/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  # Build-speed Phase 0: mold is enabled ONLY here in CI (after the
  # rui314/setup-mold steps install it). Never force it in
  # .cargo/config.toml so local devs without mold keep building.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # Path filtering to avoid running slow Rust builds on frontend/docs-only PRs
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      embedding: ${{ steps.filter.outputs.embedding }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'code-graph/**'
              - 'vendor/maloca-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'code-graph/**/Cargo.toml'
              - 'crates/**/Cargo.toml'
              - '.cargo/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - '**/build.rs'
              - '.github/workflows/ci.yml'
            frontend:
              - 'panel-ui/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            # Build-speed Phase 0: the local-gllm embedding backend is the
            # riskiest dep change, so it gets its own check job below, gated
            # on exactly the inputs that can affect it.
            embedding:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/embedding/**'

  # Job 1: Rust Format Check
  rust-fmt:
    name: Rust Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  # Job 2: Rust Clippy & Check
  rust-clippy:
    name: Rust Clippy & Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Use mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-safe-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Clippy
        run: cargo clippy --package xavier --all-targets --features ci-safe -- -D warnings

  # Job MSRV: Minimum Supported Rust Version Check
  rust-msrv:
    name: Rust MSRV Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check on MSRV
        run: cargo check --package xavier --all-targets --features ci-safe

  # Job 2b: local-gllm embedding backend check (build-speed Phase 0)
  # The candle removal is the riskiest dep change in this phase, and the
  # default/ci-safe feature sets never compile the gllm backend. Run only
  # when Cargo.toml, Cargo.lock or src/embedding/** change (see the
  # `embedding` paths-filter in the `changes` job above).
  rust-local-gllm-check:
    name: Rust local-gllm Check
    needs: changes
    if: needs.changes.outputs.embedding == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Use mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-safe-gllm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check local-gllm backend
        run: cargo check -p xavier --features local-gllm

  # Job 3: Parallel Rust Tests
  rust-test:
    name: Parallel Rust Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Use mold linker
        uses: rui314/setup-mold@v1

      - name: Configure Swap Space
        run: |
          if ! swapon --show | grep -q "/swapfile"; then
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-safe-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Lib Tests
        # Use 1 thread: tests in `src/memory/sqlite_vec_store/schema_impl.rs`
        # that mutate global ENV (`XAVIER_EMBEDDING_PROVIDER_MODE`,
        # `OPENAI_API_KEY`) cannot be parallelised across processes — the
        # `#[serial]`/`ENV_LOCK` mutex lives per-process and does not
        # coordinate cross-process. With 4 threads, 4 of those tests
        # deterministically fail (`left:0 right:1`). As of 2026-10 the serial run
        # takes ~556 s for 3,458 tests and is the CI critical path. Phase 1 of the
        # build-speed plan moves this to cargo-nextest (process-per-test,
        # isolate_test_process! sandbox); until then keep 1 thread.
        # See commit message for full rationale and reproduction log.
        run: cargo test --package xavier --lib --features ci-safe -- --test-threads=1

  # Job: Test-write tripwire
  # `scripts/check-test-writes.sh` is the guard that keeps the suite from
  # polluting the live `~/.xavier` store: it asserts every integration-test /
  # bench crate root carries `xavier::isolate_test_process!();` (a new root
  # without it fails here) and snapshots the real home around a representative
  # subset of tests to prove nothing was written. It was previously dead code:
  # not executable and referenced by no workflow, so nothing kept future tests
  # honest. `continue-on-error` because the subset run is slow and touches
  # PATH-sensitive state; the audit half is the part that must never drift.
  rust-test-hygiene:
    name: Test Hygiene Tripwire
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Use mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-safe-test
          save-if: false

      - name: Audit every test/bench root installs the sandbox
        run: |
          missing=$(grep -L 'isolate_test_process!' tests/*.rs benches/*.rs || true)
          if [ -n "$missing" ]; then
            echo "::error::missing xavier::isolate_test_process!(); in: $missing" >&2
            exit 1
          fi
          echo "OK: all test/bench crate roots are sandboxed"

      - name: Check no test writes to the real home
        run: bash scripts/check-test-writes.sh

  # Job: Observability contract gate (WAVE-29.10)
  # Scoped to the single new integration target on purpose: `tests/` holds ~119
  # test binaries, many of them environment-dependent e2e/benchmark files that
  # need live services. Running `--tests` here would put `main` at the mercy of
  # an unrelated suite (the canonical gate `scripts/ci-local.sh` and the
  # `rust-test` job above also stay on `--lib`). Widen the scope only once the
  # full suite is proven green, one target at a time.
  rust-integration:
    name: Rust Integration (Observability Contract & Vault)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Use mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-safe-test
          save-if: false

      - name: Run Observability Contract Tests
        # 1 thread, same reason as `rust-test`: several suites mutate global ENV
        # and cannot be parallelised across processes (see the comment above).
        run: cargo test --package xavier --features ci-safe --test observability_contract -- --test-threads=1

      - name: Run Clavis HTTP, Keygen & Vault E2E Tests
        run: |
          cargo test --package xavier --features ci-safe --test clavis_http_e2e -- --test-threads=1
          cargo test --package xavier --features ci-safe --test keygen_e2e -- --test-threads=1
          cargo test --package xavier --features ci-safe --test clavis_namespace_e2e -- --test-threads=1
          cargo test --package xavier --features ci-safe --test clavis_vault_smoke_e2e -- --test-threads=1

      - name: Run Recovery E2E (seal -> perder record.key -> unseal -> restore)
        # Sin TTY y hermético: HOME, XAVIER_DATA_DIR y XAVIER_RECOVERY_DIR temporales,
        # keyring inalcanzable. El script recorre el binario real (target/debug/xavier).
        run: |
          cargo test --package xavier --features ci-safe --test recovery_unseal_e2e --test recovery_cli_e2e -- --test-threads=1
          cargo build --package xavier --features ci-safe --bin xavier
          bash scripts/test-recovery-e2e.sh --bin target/debug/xavier

      - name: Run E3 (una credencial nunca vuelve en memory_search)
        run: cargo test --package xavier --features ci-safe --test v1_api_ingest_test -- --test-threads=1

  # Job 3b: Espacios (per-space keys, stores, tokens, links, routing)
  #
  # These are `tests/*.rs` targets, so `cargo test --lib` never compiles or runs
  # them: the whole Espacios surface — the core this branch integrates — had no
  # automated coverage at all until this job existed. Run one target at a time,
  # for the same ENV-mutation reason as `rust-test`.
  espacio-tests:
    name: Espacios Integration Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Use mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-safe-test
          save-if: false

      - name: Run Espacios isolation, encryption, links and auth-gate tests
        # 1 thread: these suites mutate global ENV (see `rust-test`).
        run: |
          cargo test --package xavier --features ci-safe --test espacio_memory_encryption -- --test-threads=1
          cargo test --package xavier --features ci-safe --test espacio_isolation_memory -- --test-threads=1
          cargo test --package xavier --features ci-safe --test espacio_links -- --test-threads=1
          cargo test --package xavier --features ci-safe --test espacio_space_paths -- --test-threads=1
          cargo test --package xavier --features ci-safe --test espacio_production_router -- --test-threads=1
          cargo test --package xavier --features ci-safe --test espacio_isolation_e2e -- --test-threads=1
          cargo test --package xavier --features ci-safe --test test_maloca_auth_gate -- --test-threads=1

  # Job 4: Secret Scan
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Secret Scan
        run: bash scripts/check-secrets.sh

  # Job 5: Frontend Build & Security Audit
  # NOTE: deliberately NOT gated behind `needs.changes.outputs.frontend` (see the `changes` job
  # above). This job's `panel-browser-smoke` step runs the panel-ui Playwright e2e suite, which
  # used to only run when panel-ui/** paths changed — so `main` could look green while the e2e
  # suite was actually red (backend/shared-dependency changes never re-triggered it; see #2547).
  # It now runs on every PR to main and every push to main, at the cost of a slower job on
  # backend-only changes.
  frontend-build-audit:
    name: Frontend Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build Frontend (panel-ui)
        run: pnpm --filter xavier-panel-ui run build

      # SECURITY: the panel authenticates purely via the /auth/* session — never by embedding a
      # raw API token into the built JS bundle (a prior deploy shipped VITE_XAVIER_API_TOKEN
      # inlined into production assets, a real credential-leak vector; see panel-ui's
      # useApiToken.ts / AuthProvider.tsx). This rebuilds with a canary value in that env var
      # and asserts it does NOT end up in the output, so a regression (someone re-adding an
      # `import.meta.env.VITE_XAVIER_API_TOKEN` read) fails CI instead of shipping silently.
      - name: Verify no build-time token leaks into the bundle
        env:
          VITE_XAVIER_API_TOKEN: XAVIER_CI_CANARY_TOKEN_MUST_NOT_LEAK
        run: |
          pnpm --filter xavier-panel-ui run build
          if grep -rl "XAVIER_CI_CANARY_TOKEN_MUST_NOT_LEAK\|VITE_XAVIER_API_TOKEN" panel-ui/build/assets/*.js; then
            echo "::error::VITE_XAVIER_API_TOKEN leaked into the built panel-ui bundle" >&2
            exit 1
          fi
          echo "OK: no token leak in panel-ui/build/assets/*.js"

      - name: panel-browser-smoke
        env:
          PANEL_UI_BASE_URL: http://127.0.0.1:4174
        run: |
          pnpm --filter xavier-panel-ui run build
          pnpm --filter xavier-panel-ui run test
          pnpm --filter xavier-panel-ui exec playwright install --with-deps chromium
          pnpm --filter xavier-panel-ui exec playwright test --project=chromium

      # Debuggability: this job previously had NO artifact upload at all, so a red run left
      # nothing but a list-reporter log to diagnose from (screenshots/videos/traces are
      # generated locally under panel-ui/test-results/ per playwright.config.ts's
      # screenshot/video/trace settings, but were never surfaced from CI). `if: always()` so a
      # failing panel-browser-smoke step still uploads its evidence instead of the job just
      # aborting silently.
      - name: Upload panel-ui e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-ui-e2e-results
          path: panel-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

  version-gate:
    name: Version Sync Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run swal-preflight check
        run: |
          npx --yes @swal/preflight check --cwd . || swal-preflight check --cwd . || bash scripts/check-version-sync.sh
      - name: Run Version Preflight Gate
        run: |
          bash scripts/check-version-sync.sh
          if command -v swal-preflight &> /dev/null || [ -f "periferia/swal-preflight/bin/swal-preflight.js" ]; then
            (swal-preflight preflight --wave 10 --json > /tmp/preflight.json 2>/dev/null || node periferia/swal-preflight/bin/swal-preflight.js preflight --wave 10 --json > /tmp/preflight.json)
            python3 -c "import json, sys; data=json.load(open('/tmp/preflight.json')); sys.exit(0 if data.get('ready') else 1)"
          fi

