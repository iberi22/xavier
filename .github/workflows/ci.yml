name: Xavier CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  # Job 1: Rust Format Check
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  # Job 2: Rust Clippy & Check
  rust-clippy:
    name: Rust Clippy & Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --workspace --all-targets --features ci-safe

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features ci-safe -- -D warnings

  # Job 3: Parallel Rust Tests
  rust-test:
    name: Parallel Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Lib Tests
        run: cargo test --lib --features ci-safe -- --test-threads=4

  # Job 4: Secret Scan
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scan
        run: bash scripts/check-secrets.sh

  # Job 5: Frontend Build & Security Audit
  frontend-build-audit:
    name: Frontend Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build Frontend (panel-ui)
        run: pnpm --filter xavier-panel-ui run build
