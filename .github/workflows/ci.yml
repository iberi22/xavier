name: Xavier CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  # Job 1: Rust Format Check
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  # Job 2: Rust Clippy & Check
  rust-clippy:
    name: Rust Clippy & Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --package xavier --all-targets --features ci-safe

      - name: Run Clippy
        run: cargo clippy --package xavier --all-targets --features ci-safe -- -D warnings

  # Job MSRV: Minimum Supported Rust Version Check
  rust-msrv:
    name: Rust MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check on MSRV
        run: cargo check --package xavier --all-targets --features ci-safe

  # Job 3: Parallel Rust Tests
  rust-test:
    name: Parallel Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Lib Tests
        # Use 1 thread: tests in `src/memory/sqlite_vec_store/schema_impl.rs`
        # that mutate global ENV (`XAVIER_EMBEDDING_PROVIDER_MODE`,
        # `OPENAI_API_KEY`) cannot be parallelised across processes — the
        # `#[serial]`/`ENV_LOCK` mutex lives per-process and does not
        # coordinate cross-process. With 4 threads, 4 of those tests
        # deterministically fail (`left:0 right:1`). Tests are fast enough
        # that 1 thread (~100s) is acceptable; CI wall-time cost is minimal
        # vs the engineering cost of refactoring every test to use TempEnv.
        # See commit message for full rationale and reproduction log.
        run: cargo test --package xavier --lib --features ci-safe -- --test-threads=1

  # Job 4: Secret Scan
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scan
        run: bash scripts/check-secrets.sh

  # Job 5: Frontend Build & Security Audit
  frontend-build-audit:
    name: Frontend Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build Frontend (panel-ui)
        run: pnpm --filter xavier-panel-ui run build

      - name: panel-browser-smoke
        env:
          VITE_XAVIER_API_TOKEN: dummy
          PANEL_UI_BASE_URL: http://127.0.0.1:4174
        run: |
          VITE_XAVIER_API_TOKEN=dummy pnpm --filter xavier-panel-ui run build
          grep -c "dummy\|VITE" panel-ui/dist/assets/*.js
          pnpm --filter xavier-panel-ui run test
          pnpm --filter xavier-panel-ui exec playwright install --with-deps chromium
          pnpm --filter xavier-panel-ui exec playwright test --project=chromium

  version-gate:
    name: Version Sync Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run swal-preflight check
        run: |
          npx --yes @swal/preflight check --cwd . || swal-preflight check --cwd . || bash scripts/check-version-sync.sh
      - name: Run Version Preflight Gate
        run: |
          bash scripts/check-version-sync.sh
          if command -v swal-preflight &> /dev/null || [ -f "periferia/swal-preflight/bin/swal-preflight.js" ]; then
            (swal-preflight preflight --wave 10 --json > /tmp/preflight.json 2>/dev/null || node periferia/swal-preflight/bin/swal-preflight.js preflight --wave 10 --json > /tmp/preflight.json)
            python3 -c "import json, sys; data=json.load(open('/tmp/preflight.json')); sys.exit(0 if data.get('ready') else 1)"
          fi

