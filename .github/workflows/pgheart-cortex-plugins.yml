name: Plugin Integration - Cortex & PgHeart

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin a ejecutar
        required: false
        default: all
        type: choice
        options:
          - all
          - cortex
          - pgheart
      direction:
        description: Direccion de sync
        required: false
        default: both
        type: choice
        options:
          - push
          - pull
          - both

env:
  XAVIER_VERSION: 0.6.0-beta
  RUST_BACKTRACE: "1"

jobs:
  plugin-integration:
    name: "Plugin Sync"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build plugin system
        run: cargo build --package xavier 2>&1 | tail -20

      - name: Run plugin tests
        run: "cargo test --package xavier --lib --no-default-features --features ci-safe plugins::"

      - name: Sync to Cortex Enterprise
        if: github.event_name == 'workflow_dispatch' && (inputs.plugin == 'cortex' || inputs.plugin == 'all')
        env:
          CORTEX_ENTERPRISE_URL: ${{ secrets.CORTEX_ENTERPRISE_URL }}
          CORTEX_TOKEN: ${{ secrets.CORTEX_TOKEN }}
        run: |
          if [ -z "$CORTEX_ENTERPRISE_URL" ] || [ -z "$CORTEX_TOKEN" ]; then
            echo "Cortex sync skipped: missing CORTEX_ENTERPRISE_URL or CORTEX_TOKEN."
            exit 0
          fi
          cargo run --package xavier --bin xavier -- plugin sync cortex ${{ inputs.direction || 'both' }} 2>&1

      - name: Sync to PgHeart
        if: inputs.plugin == 'pgheart' || inputs.plugin == 'all' || github.event_name == 'schedule'
        env:
          PGHEART_URL: ${{ secrets.PGHEART_URL }}
          PGHEART_TOKEN: ${{ secrets.PGHEART_TOKEN }}
          PGHEART_INSTANCE_ID: ${{ secrets.PGHEART_INSTANCE_ID }}
        run: |
          if [ -z "$PGHEART_URL" ] || [ -z "$PGHEART_TOKEN" ] || [ -z "$PGHEART_INSTANCE_ID" ]; then
            echo "PgHeart sync skipped: missing PGHEART_URL, PGHEART_TOKEN, or PGHEART_INSTANCE_ID."
            exit 0
          fi
          cargo run --package xavier --bin xavier -- plugin sync pgheart ${{ inputs.direction || 'both' }} 2>&1
