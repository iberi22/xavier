name: Ledger Gaps

on:
  workflow_run:
    workflows: ["Ledger Promoter"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Ledger Promoter workflow run ID to use'
        required: true

permissions: {}

concurrency:
  group: ledger-gaps
  cancel-in-progress: false

jobs:
  manage-gaps:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Ledger Promoter' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate promoter run provenance
        id: run-id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$EVENT_RUN_ID"
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Run ID must be numeric."
            exit 1
          fi
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg sha "$HEAD_SHA" '
              .name == "Ledger Promoter" and .conclusion == "success" and
              .head_branch == "main" and .head_sha == $sha' > /dev/null
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.run-id.outputs.id }}
          github-token: ${{ github.token }}
          name: ledger-promoter-evidence
          path: /tmp

      - name: Extract SHA
        id: extract-sha
        env:
          EXPECTED_SHA: ${{ steps.run-id.outputs.sha }}
        run: |
          jq -e --arg sha "$EXPECTED_SHA" '.main_head == $sha' /tmp/ledger-report.json > /dev/null
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.extract-sha.outputs.sha }}
          persist-credentials: false

      - name: Determine main red status and run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.extract-sha.outputs.sha }}
        run: |
          # Fetch repository for checkout validation matching SHA
          if [ -z "$SHA" ] || [ "$SHA" == "null" ]; then
            echo "Failed to extract SHA from ledger report."
            exit 0
          fi

          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$SHA" != "$HEAD_SHA" ]; then
            echo "Report SHA $SHA differs from current main HEAD $HEAD_SHA; stopping."
            exit 0
          fi

          # Get latest push run of ci.yml on main for the evaluated SHA
          CI_STATUS=$(gh run list --workflow=ci.yml --branch=main --commit="$SHA" --event=push --limit=1 --json conclusion -q '.[0].conclusion' || echo "unknown")

          if [ "$CI_STATUS" != "success" ]; then
            MAIN_RED_FLAG="--main-red"
            echo "CI on main is red or missing for $SHA ($CI_STATUS)."
          else
            MAIN_RED_FLAG=""
          fi

          python3 scripts/ledger-gap-issues.py --report /tmp/ledger-report.json $MAIN_RED_FLAG >> $GITHUB_STEP_SUMMARY
