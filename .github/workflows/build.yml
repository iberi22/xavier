name: Multi-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            binary: xavier
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            binary: xavier.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            binary: xavier

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install llvm -y
          echo "LLVM_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Check warnings count
        run: |
          echo "WARNING_COUNT=$(cargo check --target ${{ matrix.target }} --all-targets --features ci-safe 2>&1 | grep -c "warning:" || echo 0)" >> $GITHUB_ENV
        shell: bash

      - name: Display warning count
        run: echo "Total warnings found:${{ env.WARNING_COUNT }}"

      - name: Run clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets --features ci-safe -- -D warnings

      - name: Run smoke test (lib)
        run: cargo test --target ${{ matrix.target }} --lib --no-default-features --features ci-safe

      - name: Build release binary
        run: cargo build --target ${{ matrix.target }} --release --bin xavier --features ci-safe

      - name: Rename binary for upload
        run: |
          mkdir -p dist
          OS_NAME=$(echo "${{ matrix.os }}" | cut -d'-' -f1)
          BINARY_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$BINARY_PATH" dist/xavier-${OS_NAME}-${{ matrix.arch }}.exe
          else
            cp "$BINARY_PATH" dist/xavier-${OS_NAME}-${{ matrix.arch }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavier-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/xavier-*
          if-no-files-found: error
