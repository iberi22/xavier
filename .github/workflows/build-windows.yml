name: Build Windows Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Install LLVM (for libsql-ffi bindgen)
        run: |
          choco install llvm -y
          echo "LLVM_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Verify tools
        run: |
          cmake --version
          clang --version
          rustc --version
          cargo --version

      - name: Build release binary
        run: |
          cargo build --release --bin xavier --features "local-gllm,cli-interactive" --no-default-features
        env:
          LIBCLANG_PATH: "C:\Program Files\LLVM\bin"

      - name: Build TUI binary
        run: |
          cargo build --release --bin xavier-tui --features "local-gllm,cli-interactive" --no-default-features
        env:
          LIBCLANG_PATH: "C:\Program Files\LLVM\bin"

      - name: Package binaries
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item "target\release\xavier.exe" "dist\xavier.exe"
          Copy-Item "target\release\xavier-tui.exe" "dist\xavier-tui.exe"
          Copy-Item "README-WINDOWS.md" "dist\README.md"
          Copy-Item "install.ps1" "dist\install.ps1"
          Copy-Item "config\xavier.config.json" "dist\xavier.config.example.json" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\*" -DestinationPath "xavier-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavier-windows-x64
          path: |
            dist/xavier.exe
            dist/xavier-tui.exe
            dist/README.md
            dist/install.ps1
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavier-windows-x64-zip
          path: xavier-windows-x64.zip
          retention-days: 30

  # Optional: Create GitHub Release on tag push
  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: xavier-windows-x64-zip
          path: ./release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/xavier-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
