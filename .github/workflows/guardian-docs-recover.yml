name: Guardian Docs Recover

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'The retained good SHA'
        required: true
        type: string
      artifact_digest:
        description: 'The retained artifact digest'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate artifact_digest format
        run: |
          if [[ ! "${{ inputs.artifact_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "artifact_digest is malformed"
            exit 1
          fi

      - name: Fetch current inventory.json using GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/contents/inventory.json -q '.content' | base64 -d > inventory.json || true

      - name: Validate sha against inventory
        run: |
          if [ -f inventory.json ]; then
            RECORDED=$(jq -r '.targets[] | select(.kind == "gh_pages") | .retained.source_sha // empty' inventory.json 2>/dev/null || echo "")
            if [ -n "$RECORDED" ] && [ "${{ inputs.sha }}" != "$RECORDED" ]; then
              echo "sha differs from the inventory's recorded good SHA for the docs target"
              exit 1
            fi
          fi

      - name: Checkout pinned input
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Public-URL smoke step
        run: echo "Smoke test the public URL"
