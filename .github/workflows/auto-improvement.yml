name: Auto-Improvement Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly: 3 AM every Monday

jobs:
  auto-improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Xavier
        run: cargo build --release --bin xavier

      - name: Run benchmark suite
        run: ./target/release/xavier recall "benchmark context" --limit 10

      - name: Run auto-improvement cycle
        run: ./target/release/xavier auto-improve run

      - name: Check for changes
        id: git-check
        run: |
          git add xavier.config.json
          git diff --staged --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[AUTO] Weekly auto-improvement: ${{ github.event.repository.updated_at }}"
          title: "[AUTO] Weekly auto-improvement: ${{ github.event.repository.updated_at }}"
          body: |
            ## Weekly Auto-Improvement Cycle Result

            This PR contains automatic configuration adjustments generated by the Xavier Auto-Improvement loop.

            ### Cycle Summary
            The cycle was triggered by the weekly schedule. Benchmark results and identifying gaps were processed, and improvements were merged into the configuration.

            Refer to the generated report in the `reports/` directory for full details.

            **Safety:** This PR is created as a DRAFT. Auto-merge is NOT enabled.
          branch: auto-improvement-update
          draft: true
          delete-branch: true
