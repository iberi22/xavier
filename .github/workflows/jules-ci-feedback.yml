name: Jules CI Auto-Fixer Feedback Loop

on:
  workflow_run:
    workflows: ["Xavier CI / CD"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  notify-jules-on-failure:
    name: Trigger Jules Auto-Fix on CI Failure
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Failed Logs and Notify PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Inspecting failing run $RUN_ID for branch $HEAD_BRANCH..."
          if [ "$HEAD_BRANCH" = "main" ]; then
            echo "Failure is on main (no PR to notify). Skipping."
            exit 0
          fi

          # Find open PR for this branch
          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --json number -q '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $HEAD_BRANCH. Skipping notification."
            exit 0
          fi

          echo "Found PR #$PR_NUMBER for branch $HEAD_BRANCH"

          # Extract failed logs (last 40 lines of failures)
          FAILED_LOG=$(gh run view "$RUN_ID" --log-failed 2>&1 | tail -n 40 || echo "Logs unavailable")

          # NOTE: no heredoc here — heredoc bodies at column 0 break the YAML
          # block scalar (see fix(ci) PR). Build the comment via echo group.
          {
            echo "🤖 **CI Auto-Fixer Alert — Checks Failed**"
            echo ""
            echo "A failure was detected in CI run [$RUN_ID]($RUN_URL)."
            echo ""
            echo '```text'
            echo "$FAILED_LOG"
            echo '```'
            echo ""
            echo "@jules Please inspect the failure above, apply the necessary fix on this branch \`$HEAD_BRANCH\`, and push the changes to re-trigger CI."
          } > /tmp/jules-ci-comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/jules-ci-comment.md
          echo "Successfully notified Jules on PR #$PR_NUMBER."
