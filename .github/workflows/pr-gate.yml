name: PR Gate (Report Only)

# Non-blocking PR parity gate workflow calling scripts/ci-local.sh
# Standard SWAL pattern: report pass/fail summary without blocking PR merge on Actions budget limits.

on:
  pull_request:
    branches:
      - main
      - 'sprint/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'panel-ui/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  pr-parity-gate:
    name: Local CI Parity Check
    runs-on: ubuntu-latest
    continue-on-error: true # Flip to false if remote blocking enforcement is explicitly requested

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo target and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pr-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pr-gate-

      - name: Run Canonical Local CI Gates
        id: ci_gate
        continue-on-error: true
        run: |
          bash scripts/ci-local.sh

  task-evidence-check:
    name: Task Evidence Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Check Evidence Bundle
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          FILE=$(echo "$PR_BODY" | grep -oE '^\.gitcore/[A-Za-z0-9._/-]+\.json$' | head -1 || true)
          if [ -n "$FILE" ]; then
            if [ -f "$FILE" ]; then
              bash scripts/done-check.sh "$FILE" || echo "::notice::SHADOW: script returned non-zero"
            else
              echo "::notice::SHADOW: would fail — Bundle file $FILE not found"
            fi
          else
            echo "::notice::SHADOW: would fail — no bundle"
          fi
