[package]
name = "app"
version = "0.0.1"
description = "Xavier — Cognitive Memory System for AI Agents"
authors = ["SWAL Systems <dev@swal.dev>"]
license = "AGPL-3.0"
repository = "https://github.com/iberi22/xavier"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
sysinfo = "0.39.6"
uuid = { version = "1.20.0", features = ["v4"] }
xavier = { path = "../../", features = ["tauri"] }
