# gitleaks config — Xavier public repo
# Run: gitleaks detect --source . --config gitleaks.toml
# Or:  scripts/check-secrets.sh

title = "Xavier gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Files that legitimately document secret patterns (never real values)"
paths = [
  '''docs/features/specs/FEATURE-.*\.md''',
  '''\.env\.example$''',
  '''docs/protocol/.*\.md$''',
  '''AGENTS\.md$''',
  '''SECURITY\.md$''',
]
# Commits whose only finding is a fake test credential (verified by hand).
# 8a827d62 (#2863): ingest-screening fixture in tests/v1_api_ingest_test.rs.
commits = [
  "8a827d627381f1002a23875d63ea06de5d334a96",
]

[[rules]]
id = "xavier-token-placeholder"
description = "Xavier token placeholder in .env.example"
regex = '''XAVIER_TOKEN=replace-with-a-long-random-token'''
secretGroup = 1
allowlist = { paths = ['''\.env\.example$'''] }

[[rules]]
id = "swal-dev-email"
description = "SWAL dev emails (public identity, but block accidental real creds)"
regex = '''[a-zA-Z0-9._%+-]+@swal\.dev'''
secretGroup = 1
allowlist = { paths = ['''Cargo\.toml$'''] }
