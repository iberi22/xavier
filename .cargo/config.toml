[build]
# NOTE (mitigación auditoría DX 2026-09): NO fijar `target-dir` aquí.
# La documentación (README, QUICKSTART) indica `./target/release/xavier`;
# un target-dir en /tmp rompe esos comandos y pierde la caché incremental
# en cada reinicio. Quien necesite RAM disk persistente puede exportar
# CARGO_TARGET_DIR en su shell (ver shell.nix).

# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[net]
# Allow online fetching by default so CI on fresh checkout does not fail,
# while caching registry crates locally on metered connections.
offline = false

[env]
RUST_MIN_STACK = "16777216"
RUST_TEST_THREADS = "1"
# Optional local build acceleration via sccache (Wave-24 Phase 0):
# export RUSTC_WRAPPER=sccache
# export SCCACHE_CACHE_SIZE=10G

