[build]
# target-dir removed: was "/build/rust-target/xavier" (broke GH Actions: /build read-only).
# NixOS devs: export CARGO_TARGET_DIR=/build/rust-target/xavier via direnv/shell.nix if you need RAM-disk.
# Default "target/" is used in CI and local unless CARGO_TARGET_DIR is set.
# rustflags = ["-C", "link-arg=-fuse-ld=mold"] # Commented out (causes Bus error in CI runners)

# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[env]
RUST_MIN_STACK = "16777216"
RUST_TEST_THREADS = "1"
