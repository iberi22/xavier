[package]
name = "xavier"
version = "0.0.1"
authors = ["BELA <bela@swal.dev>", "Xavier <xavier@swal.dev>"]
edition = "2021"
autobins = false
default-run = "xavier"
description = "Xavier - Cognitive Memory Runtime for AI Agents (AGPL v3 + Commercial)"
license = "AGPL-3.0"
repository = "https://github.com/iberi22/xavier"
homepage = "https://github.com/iberi22/xavier"
keywords = ["memory", "ai-agents", "vector-database", "rag", "embeddings"]
categories = ["database", "science", "data-structures"]

[package.metadata.enterprise]
brand = "Xavier"
compatibility_alias = "xavier"
open_source_license = "AGPL-3.0"
commercial_license = "Xavier-Commercial-1.0"

enterprise_contact = "iberi22"
support_model = "dual-license-open-core"
enterprise_reserved_features = [
    "advanced-rrf",
    "enterprise-embeddings",
    "advanced-audit-logging",
    "priority-support-queue",
]

[lib]
name = "xavier"
path = "src/lib.rs"

[workspace]
members = [
    "code-graph",
    "crates/xavier-core-logic",
    "crates/xavier-wasm",
    "panel-ui/src-tauri",
    "code-graph/parsers/parser-rust",
    "code-graph/parsers/parser-ts",
    "code-graph/parsers/parser-python",
    "code-graph/parsers/parser-go",
    "code-graph/parsers/parser-java",
    "code-graph/parsers/parser-c",
    "code-graph/parsers/parser-cpp",
]
# NOTE: "xavier-core" is excluded from the workspace. It is an incomplete
# WIP refactor (duplicates src/memory/sqlite_vec_store/) that does not compile
# and is NOT consumed by any crate (xavier, code-graph, panel-ui). Re-add it
# once its refactor is complete (see issue #542). Excluding is non-destructive:
# the directory and its files remain in the repo.

[features]
default = ["cli-interactive", "notification-in-app", "notification-webhook", "notification-email", "self-manage", "dao-evm"]
notification-in-app = []
notification-webhook = []
notification-email = []
data-commons = ["post-quantum"]
post-quantum = ["oqs"]
cli-interactive = ["ratatui", "crossterm"]
# All features that are safe to run on host CI (no GUI/Winit issues)
ci-safe = ["self-manage"]
self-manage = []
gpu-search = ["dep:candle-core", "dep:candle-nn"]
gpu-search-cuda = ["gpu-search", "candle-core/cuda", "candle-nn/cuda"]
gpu-search-metal = ["gpu-search", "candle-core/metal", "candle-nn/metal"]
test-utils = []
bench-runners = []
tauri = ["dep:tauri"]
telegram = ["teloxide/macros", "teloxide/webhooks-axum"]
local-gllm = ["dep:gllm", "gllm/wgpu", "dep:candle-core"]
local-gllm-cuda = ["dep:gllm", "gllm/cuda", "dep:candle-core"]
dev-mode = []
# Enterprise features: Cortex Enterprise Cloud integration
enterprise = []
mesh = ["dep:iroh"]
libp2p = []
dao-evm = ["dep:alloy"]

[[test]]
name = "auth_register_test"
path = "tests/integration/auth_register_test.rs"

[[bench]]
name = "embedding_benchmark"
path = "benches/embedding_benchmark.rs"
harness = false

[[bench]]
name = "hybrid_search"
path = "benches/hybrid_search.rs"
harness = false

[[bench]]
name = "retrieval_hormer"
path = "benches/retrieval_hormer.rs"
harness = false

[[bench]]
name = "entity_graph_benchmark"
path = "benches/entity_graph_benchmark.rs"
harness = false

[[bench]]
name = "api_v1"
path = "benches/api_v1.rs"
harness = false

[[bench]]
name = "minhash_bench"
path = "benches/minhash_bench.rs"
harness = false

[[bench]]
name = "cortex"
path = "benches/cortex.rs"
harness = false

[[bench]]
name = "mcp_benchmark"
path = "benches/mcp_benchmark.rs"
harness = false

[[test]]
name = "auth_full_flow_test"
path = "tests/integration/auth_full_flow_test.rs"

[[test]]
name = "rbac_e2e"
path = "tests/e2e/rbac_e2e.rs"

[[test]]
name = "crypto_e2e"
path = "tests/e2e/crypto_e2e.rs"

[[test]]
name = "telegram_bot_e2e"
path = "tests/e2e/telegram_bot_e2e.rs"

[[test]]
name = "mcp_e2e"
path = "tests/e2e/mcp_e2e.rs"

[[test]]
name = "notification_e2e"
path = "tests/e2e/notification_e2e.rs"

[[test]]
name = "hormer_navigation_e2e"
path = "tests/e2e/hormer_navigation_e2e.rs"

[[test]]
name = "governance_e2e"
path = "tests/e2e/governance_e2e.rs"

[[test]]
name = "decentralized_login_e2e"
path = "tests/e2e/decentralized_login_e2e.rs"

[[test]]
name = "context_regen_e2e"
path = "tests/e2e/context_regen_e2e.rs"

[[test]]
name = "multi_node_sync"
path = "tests/e2e/multi_node_sync.rs"

[[test]]
name = "clearance_access_audit"
path = "tests/e2e/clearance_access_audit.rs"

[[test]]
name = "xtsp"
path = "tests/xtsp/mod.rs"

[dependencies]
xavier-core-logic = { path = "crates/xavier-core-logic" }
code-graph = { path = "./code-graph" }
maloca-core = { path = "vendor/maloca-core" }
anyhow = "1.0.102"
git2 = { version = "0.21", default-features = false }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
gllm = { version = "0.10.6", default-features = false, optional = true }
candle-core = { version = "=0.9.1", optional = true }
candle-nn = { version = "=0.9.1", optional = true }
teloxide = { version = "0.12", default-features = false, features = ["rustls"], optional = true }
tauri = { version = "2.11.1", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
colored = "2.1"
thiserror = "2.0.18"
flate2 = "1.0"
tokio = { version = "1.52.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
# Used by the MCP Streamable HTTP (SSE) transport to build the keepalive stream.
# Also a transitive dependency of axum, so no extra version is pulled in.
futures-util = "0.3"
ulid = "1.1"
uuid = { version = "1.23", features = ["v4", "serde"] }
dirs = "6.0"
sysinfo = "0.36"

# Constant-time comparison for security tokens
subtle = "2.6"
hkdf = "0.12"

# HTTP Server
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CLI arguments
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13.4"

# TUI Dashboard
ratatui = { version = "0.30", optional = true, features = ["serde"] }
crossterm = { version = "0.28", optional = true }

# Observability & Metrics
autometrics = { version = "0.3", features = ["prometheus-exporter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"
# State management
rayon = "1.10"
parking_lot = "0.12"
rusqlite = { version = "0.32.0", features = ["bundled", "load_extension", "chrono", "functions"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
totp-rs = { version = "5.5", features = ["gen_secret", "otpauth"] }
qrcode = "0.14"
rsa = "0.9"
base32 = "0.5"
libsql = { version = "0.9", default-features = false, features = ["core"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "json", "uuid"] }
zerocopy = "0.8"

# File traversal
walkdir = "2"
libc = "0.2"
notify = "6.1.1"

# Hardware Security
keyring = "3"

# For WASM web deployment
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# URL parsing (Origin validation for MCP 2026-07-28)
url = "2"

# Security - Pattern matching
regex = "1.10"

memchr = "2.5"

# Security - Prompt Injection Detection
sha2 = "0.10"

# Security - Phrase matching (Aho-Corasick)
aho-corasick = "1.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

unicode-normalization = "0.1"

# Embedding cache (LRU + TTL)
moka = { version = "0.12", features = ["future"] }

# E2E Encryption for cloud tier
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rand_chacha = "0.3"
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# HTTP body utilities for webhook handling
http-body-util = "0.1"
serde_yaml = "0.9.34"
dialoguer = "0.12.0"
oqs = { version = "0.11.0", features = ["kems", "sigs", "serde"], optional = true }
bip39 = { version = "2.2.2", features = ["rand", "spanish"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
bech32 = "0.9.1"
bincode = "1.3.3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "reusable_secrets"] }
sqlite-vec = "0.1.0"
# Iroh provides QUIC-based P2P transport with automatic NAT traversal (the mesh
# roadmap's "Phase 2"). Feature-gated under `mesh` so the default
# build stays lean; the IrohTransport is the preferred P2P backend going forward.
iroh = { version = "1.0", optional = true }
alloy = { version = "=2.1.1", optional = true, default-features = true, features = ["providers", "consensus", "signers", "signer-local", "contract", "rpc-types-eth", "reqwest", "network"] }
ciborium = "0.2.2"
zstd = "0.13.3"

[dev-dependencies]
serial_test = "3.2"
mockito = "1.6"
image = "0.25"
proptest = "1.11.0"
tempfile = "3.27.0"
criterion = "0.5"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tokio-tungstenite = "0.29"
futures-util = "0.3"

[[bin]]
name = "xavier"
path = "src/main.rs"
test = false

[[bin]]
name = "xavier-tui"
path = "src/main_tui.rs"
required-features = ["cli-interactive"]

[[bin]]
name = "backfill_embeddings"
path = "src/bin/backfill_embeddings.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

