[patch.crates-io]
burn-candle = { path = "patches/burn-candle" }

[package]
name = "xavier"
version = "0.12.0"
authors = ["BELA <bela@swal.dev>", "Xavier <xavier@swal.dev>"]
edition = "2021"
autobins = false
description = "Xavier - Cognitive Memory Runtime for AI Agents (AGPL v3 + Commercial)"
license = "AGPL-3.0"
repository = "https://github.com/iberi22/xavier"
homepage = "https://github.com/iberi22/xavier"
keywords = ["memory", "ai-agents", "vector-database", "rag", "embeddings"]
categories = ["database", "science", "data-structures"]

[package.metadata.enterprise]
brand = "Xavier"
compatibility_alias = "xavier"
open_source_license = "AGPL-3.0"
commercial_license = "Xavier-Commercial-1.0"
mesh_license = "Xavier-Mesh-1.0"

enterprise_contact = "iberi22"
support_model = "dual-license-open-core"
enterprise_reserved_features = [
    "advanced-rrf",
    "enterprise-embeddings",
    "advanced-audit-logging",
    "priority-support-queue",
]

[lib]
name = "xavier"
path = "src/lib.rs"

[workspace]
members = [
    "clients/flutter_android/rust",
    "code-graph",
    "codegraph-types",
    "parsers/codegraph-types-legacy",
    "parsers/codegraph-parse-typescript",
    "panel-ui/src-tauri"
]
