[package]
name = "code-graph"
version = "0.6.1-beta"
edition = "2021"
description = "Codebase Understanding without RAG - Tree-sitter + Agentic Search"
license = "MIT"
repository = "https://github.com/southwest-ai-labs/code-graph"
authors = ["Southwest AI Labs <dev@southwestai.io]"]
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Tree-sitter - todas las versiones 0.23 (últimas estables)
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# File traversal
walkdir = "2"
ignore = "0.4"
globset = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP Server
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
hyper = "1"
hyper-util = "0.1"

# Async mutex for shared state
parking_lot = "0.12"

# Plugin types
codegraph-types = { path = "../codegraph-types" }
dirs = "6"

# Plugin registry: HTTP client (rustls to avoid OpenSSL on Windows),
# archive extraction, and versioning. Pinned per FEATURE-plugin-system.md.
# `zip` uses no-default-features + `deflate`: the default `xz`/`deflate-zlib`
# features pull in liblzma-sys/xz2, which conflicts with the lzma linkage
# already present in the workspace via the xavier burn/cubecl stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
async-trait = "0.1"

# Database
rusqlite = { version = "0.32.0", features = ["bundled"] }
notify = "6.1.1"

# Plugin downloads need a scratch dir at runtime (tempfile is also a dev-dep).
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "code-graph"
path = "src/main.rs"

[lib]
name = "code_graph"
path = "src/lib.rs"
