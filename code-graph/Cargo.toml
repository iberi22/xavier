[package]
name = "code-graph"
version = "0.1.1"
edition = "2021"
description = "Codebase Understanding without RAG - Tree-sitter + Agentic Search"
license = "MIT"
repository = "https://github.com/southwest-ai-labs/code-graph"
authors = ["Southwest AI Labs <dev@southwestai.io]"]
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Tree-sitter - optional when native-parsers is disabled
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }

# File traversal
walkdir = "2"
ignore = "0.4"
globset = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP Server
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
hyper = "1"
hyper-util = "0.1"

# Async mutex for shared state
parking_lot = "0.12"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }

# Plugin types
codegraph-types = { path = "../codegraph-types" }
dirs = "6"
which = "6"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Database
rusqlite = { version = "0.32.0", features = ["bundled"] }
notify = "6.1.1"
tempfile = "3"

[dev-dependencies]

[[bin]]
name = "code-graph"
path = "src/main.rs"

[features]
default = ["native-parsers"]
native-parsers = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
]

[lib]
name = "code_graph"
path = "src/lib.rs"
