# Cargo nextest configuration for Xavier
# Reference: SUBAGENT-OUT/wave24-modularization-phase0.md

[profile.ci]
slow-timeout = { period = "120s", terminate-after = 3 }
test-threads = "num-cpus"
fail-fast = false
retries = 1

# Tests that mutate global ENV must run with a single thread
[[profile.ci.overrides]]
filter = "test(schema_impl) or test(embedding_provider_mode)"
test-threads = "1"

# NO override needed for codegraph_sidecar / tools_secrets secret_exec / wal_streamer
# stress tests: their cross-test races under process-per-test parallelism are fixed
# in code (private CARGO_TARGET_DIR/HOME/PATH/cwd for the sidecar mock-download
# test, XAVIER_INSIDE_TEST=1 for the lib-test binary, a private TMPDIR for the
# exec temp-file count, busy_timeout=5000 on the stress writers). Do not
# re-introduce per-test serialization here without re-measuring.

# U7: the 17 files that use serial_test run one test at a time (test-group "serial").
[test-groups]
serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(=suite_01) & test(/^(access_flush_drain|adversarial_challenge_2_stress|clavis_http_e2e|clavis_namespace_e2e|clavis_vault_smoke_e2e)::/)'
test-group = "serial"

[[profile.default.overrides]]
filter = 'binary(=suite_02) & test(/^(clearance_audit_sqlite|d1_clavis_vault_leak_red)::/)'
test-group = "serial"

[[profile.default.overrides]]
filter = 'binary(=suite_03) & test(/^(embedding_fallback_resilience|env_guard)::/)'
test-group = "serial"

[[profile.default.overrides]]
filter = 'binary(=suite_04) & test(/^(guardian_truth_test)::/)'
test-group = "serial"

[[profile.default.overrides]]
filter = 'binary(=suite_07) & test(/^(memory_write_integrity_e2e|mesh_auth_binding_test|mesh_integration)::/)'
test-group = "serial"

[[profile.default.overrides]]
filter = 'binary(=suite_09) & test(/^(recovery_cli_e2e|recovery_unseal_e2e)::/)'
test-group = "serial"

[[profile.default.overrides]]
filter = 'binary(=suite_11) & test(/^(skill_route_clearance)::/)'
test-group = "serial"

[[profile.default.overrides]]
filter = 'binary(=suite_13) & test(/^(tgd_prune_gate_test)::/)'
test-group = "serial"

