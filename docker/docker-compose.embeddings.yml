# Docker Compose for Embedding Services
# 
# Services:
#   infinity     - Infinity embedding server (RECOMMENDED) with Qwen3-Embedding-0.6B
#                 Port: 7997 | OpenAI-compatible API
#   tei          - HuggingFace Text Embeddings Inference (alternative)
#                 Port: 7998 | HF API format
#   ollama       - Ollama with nomic-embed-text (lightweight)
#                 Port: 11434 | Ollama API
#
# Usage:
#   docker compose -f docker/docker-compose.embeddings.yml up -d infinity
#   docker compose -f docker/docker-compose.embeddings.yml down

services:
  infinity:
    image: michaelf34/infinity:latest
    container_name: infinity-embed
    ports:
      - "7997:7997"
    volumes:
      - infinity-cache:/app/.cache
    environment:
      - HF_HOME=/app/.cache
      - INFINITY_BATCH_SIZE=32
      - INFINITY_MODEL=Qwen/Qwen3-Embedding-0.6B
    command: >
      --model-id Qwen/Qwen3-Embedding-0.6B
      --port 7997
      --batch-size 32
    restart: unless-stopped
    # NOTE: For AMD GPUs, use default runtime (no device reservation needed)
    # For NVIDIA GPUs, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    #           driver: nvidia
    #           count: all

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: tei-embed
    ports:
      - "7998:80"
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
    command: >
      --model-id Alibaba-NLP/gte-Qwen2-1.5B-instruct
      --port 80
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-embed
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    command: serve
    restart: unless-stopped

volumes:
  infinity-cache:
  ollama-data:
