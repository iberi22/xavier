[package]
name = "xavier-core"
version = "0.1.0"
edition = "2021"
description = "Core memory and search logic for Xavier"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32.0", features = ["bundled", "load_extension", "chrono", "functions"] }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
subtle = "2.6"
sqlite-vec = "0.1.0"
regex = "1.10"
once_cell = "1.19"
base64 = "0.22"
ulid = "1.1"
uuid = { version = "1.23", features = ["v4", "serde"] }
dirs = "6.0"
tracing = "0.1"
walkdir = "2"
libc = "0.2"
moka = { version = "0.12", features = ["future"] }
argon2 = "0.5"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
