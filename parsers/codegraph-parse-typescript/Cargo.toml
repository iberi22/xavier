[package]
name = "codegraph-parse-typescript"
version = "0.1.0"
edition = "2021"

[dependencies]
codegraph-types = { path = "../../codegraph-types" }
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "codegraph-parse-typescript"
path = "src/main.rs"
