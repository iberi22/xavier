[package]
name = "xavier-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
sha2 = "0.11"
aes-gcm = "0.10"
argon2 = "0.6"
rand = "0.8"
bip39 = { version = "2.2.2", features = ["rand", "spanish"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.6"
async-trait = "0.1"
xavier-core-logic = { path = "../xavier-core-logic" }
